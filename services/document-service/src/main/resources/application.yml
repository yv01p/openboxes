server:
  port: 8081

spring:
  application:
    name: document-service
  servlet:
    multipart:
      # Mirrors the Grails-side Document.fileContents constraint (maxSize: 10485760).
      # Spring Boot default is 1MB, which would reject uploads the Grails surface accepts.
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DATASOURCE_URL:jdbc:mariadb://db:3306/openboxes?serverTimezone=UTC&useSSL=false}
    username: ${DATASOURCE_USERNAME:openboxes}
    password: ${DATASOURCE_PASSWORD:openboxes}
  jpa:
    hibernate:
      ddl-auto: validate  # Liquibase owns schema; JPA only validates the entity-to-table mapping
    properties:
      hibernate.dialect: org.hibernate.dialect.MariaDBDialect
  liquibase:
    change-log: classpath:db/changelog/document-changelog-master.xml

openboxes:
  jwt:
    secret: ${OPENBOXES_JWT_SECRET}

# Surface JwtCookieAuthFilter's rejection log (T7-M1). DEBUG is fine because the line
# logs only the exception class name, never the token or claim contents.
logging:
  level:
    org.openboxes.document.security: DEBUG
