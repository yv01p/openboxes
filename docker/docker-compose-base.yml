services:
    app:
      build:
        context: ../build/docker
        dockerfile: Dockerfile
      image: ${OB_IMAGE_REPOSITORY-ghcr.io/}openboxes/openboxes:${OB_VERSION:-latest}
      container_name: openboxes-app
      expose:
        - "8080"
      ports:
        - 8080:8080
      environment:
        DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-openboxes}
        DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-openboxes}
        DATASOURCE_URL: ${DATASOURCE_URL:-jdbc:mysql://db/openboxes?serverTimezone=UTC&useSSL=false}
        GRAILS_SERVER_URL: ${GRAILS_SERVER_URL:-http://localhost:8080/openboxes/}
        JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms1024m -Xmx1024m -XX:+UseParallelGC -Djava.awt.headless=true}
        OPENBOXES_JWT_SECRET: ${OPENBOXES_JWT_SECRET:-dev-secret-only-for-local-please-rotate-in-prod}
      healthcheck:
        test: "curl --fail --silent localhost:8080/openboxes/health | grep '\"status\":\"UP\"' || exit 1"
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s

    document-service:
      build:
        context: ../services/document-service
        dockerfile: Dockerfile
      container_name: openboxes-document-service
      expose:
        - "8081"
      environment:
        DATASOURCE_URL: ${DATASOURCE_URL:-jdbc:mariadb://db:3306/openboxes?serverTimezone=UTC&useSSL=false}
        DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-openboxes}
        DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-openboxes}
        OPENBOXES_JWT_SECRET: ${OPENBOXES_JWT_SECRET:-dev-secret-only-for-local-please-rotate-in-prod}
      healthcheck:
        test: "curl --fail --silent localhost:8081/actuator/health | grep '\"status\":\"UP\"' || exit 1"
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s

    identity-service:
      build:
        context: ../services/identity-service
        dockerfile: Dockerfile
      container_name: openboxes-identity-service
      expose:
        - "8082"
      environment:
        DATASOURCE_URL: ${DATASOURCE_URL:-jdbc:mariadb://db:3306/openboxes?serverTimezone=UTC&useSSL=false}
        DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-openboxes}
        DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-openboxes}
        OPENBOXES_JWT_SECRET: ${OPENBOXES_JWT_SECRET:-dev-secret-only-for-local-please-rotate-in-prod}
        MAIL_HOST: ${MAIL_HOST:-localhost}
        MAIL_PORT: ${MAIL_PORT:-1025}
        MAIL_USERNAME: ${MAIL_USERNAME:-}
        MAIL_PASSWORD: ${MAIL_PASSWORD:-}
        MAIL_FROM: ${MAIL_FROM:-openboxes@example.com}
        OPENBOXES_SIGNUP_ENABLED: ${OPENBOXES_SIGNUP_ENABLED:-false}
        OPENBOXES_SIGNUP_DEFAULT_ROLES: ${OPENBOXES_SIGNUP_DEFAULT_ROLES:-ROLE_BROWSER}
        OPENBOXES_SIGNUP_RECAPTCHA_ENABLED: ${OPENBOXES_SIGNUP_RECAPTCHA_ENABLED:-false}
        OPENBOXES_SIGNUP_RECAPTCHA_SECRET: ${OPENBOXES_SIGNUP_RECAPTCHA_SECRET:-}
      healthcheck:
        test: "curl --fail --silent localhost:8082/actuator/health | grep '\"status\":\"UP\"' || exit 1"
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s

    location-service:
      build:
        context: ../services/location-service
        dockerfile: Dockerfile
      container_name: openboxes-location-service
      expose:
        - "8083"
      environment:
        DATASOURCE_URL: ${DATASOURCE_URL:-jdbc:mariadb://db:3306/openboxes?serverTimezone=UTC&useSSL=false}
        DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-openboxes}
        DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-openboxes}
        OPENBOXES_JWT_SECRET: ${OPENBOXES_JWT_SECRET:-dev-secret-only-for-local-please-rotate-in-prod}
      healthcheck:
        test: "curl --fail --silent localhost:8083/actuator/health | grep '\"status\":\"UP\"' || exit 1"
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s

    organization-service:
      build:
        context: ../services/organization-service
        dockerfile: Dockerfile
      container_name: openboxes-organization-service
      expose:
        - "8084"
      environment:
        DATASOURCE_URL: ${DATASOURCE_URL:-jdbc:mariadb://db:3306/openboxes?serverTimezone=UTC&useSSL=false}
        DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-openboxes}
        DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-openboxes}
        OPENBOXES_JWT_SECRET: ${OPENBOXES_JWT_SECRET:-dev-secret-only-for-local-please-rotate-in-prod}
      healthcheck:
        test: "curl --fail --silent localhost:8084/actuator/health | grep '\"status\":\"UP\"' || exit 1"
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s

    catalog-service:
      build:
        context: ../services/catalog-service
        dockerfile: Dockerfile
      container_name: openboxes-catalog-service
      expose:
        - "8085"
      environment:
        DATASOURCE_URL: ${DATASOURCE_URL:-jdbc:mariadb://db:3306/openboxes?serverTimezone=UTC&useSSL=false}
        DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-openboxes}
        DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-openboxes}
        OPENBOXES_JWT_SECRET: ${OPENBOXES_JWT_SECRET:-dev-secret-only-for-local-please-rotate-in-prod}
      healthcheck:
        test: "curl --fail --silent localhost:8085/actuator/health | grep '\"status\":\"UP\"' || exit 1"
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s

    nginx:
      image: nginx:1.13
      container_name: openboxes-nginx
      restart: always
      ports:
      - 80:80
      volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
