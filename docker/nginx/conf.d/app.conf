server {
    listen 80;

    access_log /var/log/nginx/reverse-access.log;
    error_log /var/log/nginx/reverse-error.log;

    # T9-M1: cap upload size to match document-service's spring.servlet.multipart.max-file-size (10MB).
    # nginx's default 1m would 413 a multipart POST that document-service would otherwise accept.
    client_max_body_size 10m;

    # Block-ordering convention: insertion order (phase order), NOT alphabetical.
    # Append new service blocks at the end of the location stack, before /api/ catch-all.
    # Shared proxy_set_header triplet is in conf.d/proxy_params (see Phase 4.1 RC-11).

    location /api/identity {
        proxy_pass http://identity-service:8082;
        include /etc/nginx/conf.d/proxy_params;
    }

    location /api/documents {
        proxy_pass http://document-service:8081;
        include /etc/nginx/conf.d/proxy_params;
    }

    location = /api/location {
        proxy_pass http://location-service:8083;
        include /etc/nginx/conf.d/proxy_params;
    }

    location /api/location/ {
        proxy_pass http://location-service:8083;
        include /etc/nginx/conf.d/proxy_params;
    }

    # Phase 4: organization-service. Exact-match + prefix per Phase 3 RC-T8/T12 pattern.
    location = /api/organization {
        proxy_pass http://organization-service:8084;
        include /etc/nginx/conf.d/proxy_params;
    }

    location /api/organization/ {
        proxy_pass http://organization-service:8084;
        include /etc/nginx/conf.d/proxy_params;
    }

    # Phase 5: catalog-service. Exact-match + prefix per Phase 3 RC-T8/T12 pattern.

    location = /api/product {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }
    location /api/product/ {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }

    location = /api/category {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }
    location /api/category/ {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }

    location = /api/tag {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }
    location /api/tag/ {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }

    location = /api/synonym {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }
    location /api/synonym/ {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }

    location = /api/unitOfMeasure {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }
    # /api/unitOfMeasure/currencies is non-UoM reference data served by Grails UnitOfMeasureApiController.currencies();
    # exact-match keeps it on Grails (not captured by the catalog prefix below).
    location = /api/unitOfMeasure/currencies {
        proxy_pass http://app:8080/openboxes/api/unitOfMeasure/currencies;
        include /etc/nginx/conf.d/proxy_params;
    }
    location /api/unitOfMeasure/ {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }

    location = /api/unitOfMeasureClass {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }
    location /api/unitOfMeasureClass/ {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }

    location = /api/productType {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }
    location /api/productType/ {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }

    location = /api/attribute {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }
    location /api/attribute/ {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }

    location = /api/productGroup {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }
    location /api/productGroup/ {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }

    location = /api/productCatalogs {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }
    location /api/productCatalogs/ {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }

    location = /api/productCatalogItems {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }
    location /api/productCatalogItems/ {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }

    location = /api/productAttributes {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }
    location /api/productAttributes/ {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }

    location = /api/productAssociations {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }
    location /api/productAssociations/ {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }

    location = /api/productComponents {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }
    location /api/productComponents/ {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }

    location = /api/unitOfMeasureConversions {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }
    location /api/unitOfMeasureConversions/ {
        proxy_pass http://catalog-service:8085;
        include /etc/nginx/conf.d/proxy_params;
    }

    location /api/ {
        proxy_pass http://app:8080/openboxes/api/;
        include /etc/nginx/conf.d/proxy_params;
    }

    location /openboxes/ {
        proxy_pass http://app:8080/openboxes/;
        include /etc/nginx/conf.d/proxy_params;
    }

    # Catch-all (preserves existing behavior for unmapped paths)
    location / {
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://app:8080;
    }
}
