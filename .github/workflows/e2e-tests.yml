name: E2E Tests (Playwright)

on:
  pull_request:
    paths:
      - 'grails-app/**'
      - 'src/js/**'
      - 'docker/**'
      - 'e2e/**'
      - '.github/workflows/e2e-tests.yml'
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
          cache: gradle
      - name: Build local image with current source
        run: |
          ./gradlew prepareDocker -Dgrails.env=prod --console=plain
          docker build -t ghcr.io/openboxes/openboxes:latest build/docker/
      - name: Boot docker-compose stack
        working-directory: docker
        run: |
          docker-compose up -d
          for i in {1..60}; do
            curl -sf http://localhost/openboxes/health && break
            sleep 5
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost
          E2E_USER: admin
          E2E_PASSWORD: password
          E2E_LOCATION_ID: '1'  # CI maintainer: override with a real seed warehouse UUID if '1' is not valid in the test fixture
        run: npm test
      - name: Tear down
        if: always()
        working-directory: docker
        run: docker-compose down
