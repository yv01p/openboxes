name: E2E Tests (Playwright)

on:
  pull_request:
    paths:
      - 'grails-app/**'
      - 'src/js/**'
      - 'services/**'
      - 'docker/**'
      - 'e2e/**'
      - '.github/workflows/e2e-tests.yml'
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: 8
          distribution: temurin
          cache: gradle
      - name: Build local image with current source
        run: ./gradlew prepareDocker -Dgrails.env=prod --console=plain
      - name: Set up JDK 21 (for services)
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Build identity-service + document-service jars
        working-directory: services
        run: ./gradlew :identity-service:bootJar :document-service:bootJar :location-service:bootJar :organization-service:bootJar
      - name: Boot docker compose stack
        working-directory: docker
        run: |
          docker compose up --build -d
          for i in {1..60}; do
            curl -sf http://localhost/openboxes/health \
              && docker exec openboxes-document-service curl -sf localhost:8081/actuator/health \
              && docker exec openboxes-identity-service curl -sf localhost:8082/actuator/health \
              && docker exec openboxes-location-service curl -sf localhost:8083/actuator/health \
              && docker exec openboxes-organization-service curl -sf localhost:8084/actuator/health \
              && [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/documents)" != "502" ] \
              && break
            sleep 5
          done
      - name: Apply init-baseline.sql to repair Grails BootStrap admin seed
        # Grails BootStrap seeds admin with cleartext password + person.active=NULL,
        # which Phase 2's identity-service OpenboxesPasswordEncoder rejects (cleartext
        # is intentionally not accepted) and AuthService treats as disabled. T17 review
        # finding; tracked for proper fix in BootStrap.groovy as a T19 back-port item.
        run: docker exec -i openboxes-db mariadb -u root -proot openboxes < docker/init-baseline.sql
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost
          E2E_USER: admin
          E2E_PASSWORD: password
          E2E_LOCATION_ID: '1'  # CI maintainer: override with a real seed warehouse UUID if '1' is not valid in the test fixture
        run: npm test
      - name: Diagnostic — dump container state + logs
        if: failure()
        working-directory: docker
        run: |
          docker compose ps
          echo "---app---" && docker logs openboxes-app 2>&1 | tail -100 || true
          echo "---document-service---" && docker logs openboxes-document-service 2>&1 | tail -100 || true
          echo "---identity-service---" && docker logs openboxes-identity-service 2>&1 | tail -100 || true
          echo "---location-service---" && docker logs openboxes-location-service 2>&1 | tail -100 || true
          echo "---organization-service---" && docker logs openboxes-organization-service 2>&1 | tail -100 || true
          echo "---nginx---" && docker logs openboxes-nginx 2>&1 | tail -50 || true
      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down
