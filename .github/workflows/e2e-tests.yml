name: E2E Tests (Playwright)

on:
  pull_request:
    paths:
      - 'grails-app/**'
      - 'src/js/**'
      - 'services/**'
      - 'docker/**'
      - 'e2e/**'
      - '.github/workflows/e2e-tests.yml'
  push:
    branches: [main]

jobs:
  lint:
    # Fast-fail gate: catches ESLint errors in ~1 min instead of buried 6+ min into
    # webpack-bundle inside prepareDocker. Phase 5 retro RC-26: 6 max-len comment
    # violations in T9 React URL changes silently passed local Gradle build (cached
    # :npm_run_bundle UP-TO-DATE) but fresh CI caught them — by structuring lint as
    # its own job, future violations surface immediately with a focused log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      # React peer-dep mismatch (@testing-library/react-hooks@8 vs react@16.8.6) resolved
      # in Phase 5.1 T8 by bumping react+react-dom to 16.14.0 — --legacy-peer-deps no
      # longer required. NPM_CONFIG_ENGINE_STRICT removed in Phase 5.1 T9 — package.json
      # engines now declares node:>=22 (Node 18 EOL'd Apr 2025; lint-staged@17 requires
      # Node ≥22.22.1), matching the CI runner's node-version: '22'.
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    needs: lint  # skip the 6-min Gradle/Docker stack build if ESLint fails
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: 8
          distribution: temurin
          cache: gradle
      - name: Build local image with current source
        run: ./gradlew prepareDocker -Dgrails.env=prod --console=plain
      - name: Set up JDK 21 (for services)
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Build identity-service + document-service jars
        working-directory: services
        run: ./gradlew :identity-service:bootJar :document-service:bootJar :location-service:bootJar :organization-service:bootJar :catalog-service:bootJar :inventory-service:bootJar
      - name: Boot docker compose stack
        working-directory: docker
        run: |
          docker compose up --build -d
          for i in {1..60}; do
            curl -sf http://localhost/openboxes/health \
              && docker exec openboxes-document-service curl -sf localhost:8081/actuator/health \
              && docker exec openboxes-identity-service curl -sf localhost:8082/actuator/health \
              && docker exec openboxes-location-service curl -sf localhost:8083/actuator/health \
              && docker exec openboxes-organization-service curl -sf localhost:8084/actuator/health \
              && docker exec openboxes-catalog-service curl -sf localhost:8085/actuator/health \
              && docker exec openboxes-inventory-service curl -sf localhost:8086/actuator/health \
              && [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/documents)" != "502" ] \
              && break
            sleep 5
          done
      - name: Apply init-baseline.sql to repair Grails BootStrap admin seed
        # Grails BootStrap seeds admin with cleartext password + person.active=NULL,
        # which Phase 2's identity-service OpenboxesPasswordEncoder rejects (cleartext
        # is intentionally not accepted) and AuthService treats as disabled. T17 review
        # finding; tracked for proper fix in BootStrap.groovy as a T19 back-port item.
        run: docker exec -i openboxes-db mariadb -u root -proot openboxes < docker/init-baseline.sql
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost
          E2E_USER: admin
          E2E_PASSWORD: password
          E2E_LOCATION_ID: '1'  # CI maintainer: override with a real seed warehouse UUID if '1' is not valid in the test fixture
        run: npm test
      - name: Diagnostic — dump container state + logs
        if: failure()
        working-directory: docker
        run: |
          docker compose ps
          echo "---app---" && docker logs openboxes-app 2>&1 | tail -100 || true
          echo "---document-service---" && docker logs openboxes-document-service 2>&1 | tail -100 || true
          echo "---identity-service---" && docker logs openboxes-identity-service 2>&1 | tail -100 || true
          echo "---location-service---" && docker logs openboxes-location-service 2>&1 | tail -100 || true
          echo "---organization-service---" && docker logs openboxes-organization-service 2>&1 | tail -100 || true
          echo "---catalog-service---" && docker logs openboxes-catalog-service 2>&1 | tail -100 || true
          echo "---inventory-service---" && docker logs openboxes-inventory-service 2>&1 | tail -100 || true
          echo "---nginx---" && docker logs openboxes-nginx 2>&1 | tail -50 || true
      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down
